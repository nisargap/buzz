<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="128" height="128" shape-rendering="crispEdges" role="img" aria-label="Buzz Logo — Pixel Lightning Bolt with Two Dark Eyes Floating on a Cloud">
  <!-- Ambient Pixel Sparks -->
  <rect x="6" y="5" width="1" height="1" fill="#FFF394"/>
  <rect x="25" y="4" width="1" height="1" fill="#FFD83D"/>
  <rect x="4" y="12" width="1" height="1" fill="#FFD83D"/>
  <rect x="27" y="11" width="1" height="1" fill="#FFF394"/>

  <!-- =================================================================== -->
  <!-- FLOATING PIXEL LIGHTNING BOLT WITH TWO DARK EYES                    -->
  <!-- =================================================================== -->
  <g id="buzz-bolt">
    <!-- Dark Pixel Outline of Lightning Bolt -->
    <rect x="14" y="1" width="7" height="1" fill="#141020"/>
    <rect x="13" y="2" width="1" height="2" fill="#141020"/>
    <rect x="21" y="2" width="1" height="2" fill="#141020"/>
    <rect x="12" y="4" width="1" height="2" fill="#141020"/>
    <rect x="20" y="4" width="1" height="2" fill="#141020"/>
    <rect x="11" y="6" width="1" height="2" fill="#141020"/>
    <rect x="19" y="6" width="1" height="2" fill="#141020"/>
    <rect x="10" y="8" width="1" height="3" fill="#141020"/>
    <rect x="19" y="8" width="5" height="1" fill="#141020"/>
    <rect x="23" y="9" width="1" height="2" fill="#141020"/>
    <rect x="9" y="11" width="1" height="2" fill="#141020"/>
    <rect x="22" y="11" width="1" height="1" fill="#141020"/>
    <rect x="21" y="12" width="1" height="1" fill="#141020"/>
    <rect x="10" y="13" width="4" height="1" fill="#141020"/>
    <rect x="20" y="13" width="1" height="1" fill="#141020"/>
    <rect x="13" y="14" width="1" height="2" fill="#141020"/>
    <rect x="19" y="14" width="1" height="1" fill="#141020"/>
    <rect x="18" y="15" width="1" height="1" fill="#141020"/>
    <rect x="12" y="16" width="1" height="2" fill="#141020"/>
    <rect x="17" y="16" width="1" height="1" fill="#141020"/>
    <rect x="16" y="17" width="1" height="1" fill="#141020"/>
    <rect x="11" y="18" width="1" height="2" fill="#141020"/>
    <rect x="15" y="18" width="1" height="1" fill="#141020"/>
    <rect x="14" y="19" width="1" height="1" fill="#141020"/>
    <rect x="12" y="20" width="2" height="1" fill="#141020"/>

    <!-- Bolt Golden-Yellow Fill -->
    <rect x="14" y="2" width="7" height="2" fill="#FFE047"/>
    <rect x="13" y="4" width="7" height="2" fill="#FFE047"/>
    <rect x="12" y="6" width="7" height="2" fill="#FFE047"/>
    <rect x="11" y="8" width="8" height="1" fill="#FFE047"/>
    <rect x="11" y="9" width="12" height="2" fill="#FFD026"/>
    <rect x="10" y="11" width="12" height="1" fill="#FFD026"/>
    <rect x="10" y="12" width="11" height="1" fill="#FFC312"/>
    <rect x="14" y="13" width="6" height="1" fill="#FFC312"/>
    <rect x="14" y="14" width="5" height="1" fill="#FFB100"/>
    <rect x="14" y="15" width="4" height="1" fill="#FFB100"/>
    <rect x="13" y="16" width="4" height="1" fill="#FFA000"/>
    <rect x="13" y="17" width="3" height="1" fill="#FFA000"/>
    <rect x="12" y="18" width="3" height="1" fill="#FF8F00"/>
    <rect x="12" y="19" width="2" height="1" fill="#FF8F00"/>

    <!-- Crisp Top-Left Specular Highlight on Bolt -->
    <rect x="14" y="2" width="5" height="1" fill="#FFF8B8"/>
    <rect x="13" y="4" width="2" height="2" fill="#FFF8B8"/>
    <rect x="12" y="6" width="2" height="2" fill="#FFF8B8"/>
    <rect x="11" y="8" width="1" height="3" fill="#FFF8B8"/>

    <!-- TWO DARK EXPRESSIVE PIXEL EYES ON THE LIGHTNING BOLT -->
    <!-- Left Dark Eye -->
    <rect x="13" y="8" width="2" height="3" fill="#141020"/>
    <rect x="13" y="8" width="1" height="1" fill="#FFFFFF"/>
    <!-- Right Dark Eye -->
    <rect x="17" y="8" width="2" height="3" fill="#141020"/>
    <rect x="17" y="8" width="1" height="1" fill="#FFFFFF"/>
    <!-- Subtle Cheek Glow Pixels -->
    <rect x="12" y="11" width="1" height="1" fill="#FF8552"/>
    <rect x="19" y="11" width="1" height="1" fill="#FF8552"/>
  </g>

  <!-- =================================================================== -->
  <!-- FLUFFY PIXEL CLOUD BASE                                             -->
  <!-- =================================================================== -->
  <g id="buzz-cloud">
    <!-- Cloud Outline -->
    <rect x="10" y="21" width="5" height="1" fill="#141020"/>
    <rect x="18" y="21" width="4" height="1" fill="#141020"/>
    <rect x="7" y="22" width="3" height="1" fill="#141020"/>
    <rect x="15" y="22" width="3" height="1" fill="#141020"/>
    <rect x="22" y="22" width="3" height="1" fill="#141020"/>
    <rect x="5" y="23" width="2" height="1" fill="#141020"/>
    <rect x="25" y="23" width="2" height="1" fill="#141020"/>
    <rect x="4" y="24" width="1" height="4" fill="#141020"/>
    <rect x="27" y="24" width="1" height="4" fill="#141020"/>
    <rect x="5" y="28" width="2" height="1" fill="#141020"/>
    <rect x="25" y="28" width="2" height="1" fill="#141020"/>
    <rect x="7" y="29" width="18" height="1" fill="#141020"/>

    <!-- Cloud Pure White Upper Body -->
    <rect x="10" y="22" width="5" height="2" fill="#FFFFFF"/>
    <rect x="18" y="22" width="4" height="2" fill="#FFFFFF"/>
    <rect x="7" y="23" width="18" height="3" fill="#FFFFFF"/>
    <rect x="5" y="24" width="22" height="2" fill="#FFFFFF"/>

    <!-- Cloud Soft Pixel Shading (Bottom Rim) -->
    <rect x="5" y="26" width="22" height="1" fill="#D9E6FF"/>
    <rect x="5" y="27" width="22" height="1" fill="#B5CCF7"/>
    <rect x="7" y="28" width="18" height="1" fill="#8FAEEB"/>

    <!-- Cloud Cast Shadow from Floating Bolt -->
    <rect x="12" y="22" width="4" height="1" fill="#D9E6FF"/>
  </g>
</svg>
